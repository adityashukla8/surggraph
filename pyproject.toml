[project]
name = "surggraph"
version = "0.1.0"
description = "SurgGraph — autonomous multi-agent surgical AI system (RARP anticipation, complication enumeration, recovery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk",
    "google-genai",
    "google-cloud-aiplatform[agent_engines,adk]>=1.112",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
    "requests",
    "httpx",
    "pydicom",
    "SimpleITK",
    "opencv-python-headless",
    "python-dotenv",
    "sse-starlette",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "state", "tools", "services"]
